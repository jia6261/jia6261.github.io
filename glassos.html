    const rxFS_Logic = {
      fi: [], 
      sy: [], 
      clean: () => { rxFS_Logic.fi = []; rxFS_Logic.sy = []; },
      start: (path) => {
        const str = encodeURIComponent(path);
        if (!rxFS_Logic.sy.includes(str)) {
          rxFS_Logic.fi.push(encodeURIComponent(""));
          rxFS_Logic.sy.push(str);
          return true;
        }
        return false;
      },
      set: (path, content) => {
        const idx = rxFS_Logic.sy.indexOf(encodeURIComponent(path));
        if (idx !== -1) { rxFS_Logic.fi[idx] = encodeURIComponent(content); return true; }
        return false;
      },
      open: (path) => {
        const idx = rxFS_Logic.sy.indexOf(encodeURIComponent(path));
        return idx !== -1 ? decodeURIComponent(rxFS_Logic.fi[idx]) : null;
      },
      del: (path) => {
        const str = encodeURIComponent(path);
        const idx = rxFS_Logic.sy.indexOf(str);
        if (idx !== -1) { rxFS_Logic.fi.splice(idx, 1); rxFS_Logic.sy.splice(idx, 1); return true; }
        return false;
      },
      list: (root) => rxFS_Logic.sy.filter(s => decodeURIComponent(s).startsWith(root)).map(s => decodeURIComponent(s)),
      serialize: () => {
        return JSON.stringify({ fi: rxFS_Logic.fi, sy: rxFS_Logic.sy });
      },
      deserialize: (dataStr) => {
        try {
          const data = JSON.parse(dataStr);
          if (data.fi && data.sy) {
            rxFS_Logic.fi = data.fi;
            rxFS_Logic.sy = data.sy;
            return true;
          }
        } catch (e) { console.error("rxFS Restore Failed", e); }
        return false;
      }
    };

        setSysDialog({ show: true, title, message, value: defaultValue, isPrompt: true, isConfirm: false, onConfirm: callback });

      const saveCloudFS = async (username = cloudUser, token = cloudToken) => {
        if (!username || !token) return;
        setIsSyncing(true);
        try {
          const response = await fetch('https://glassosback.jia12s.workers.dev/api/fs/save', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ fsData: rxFS_Logic.serialize() })
          });
          if (response.ok) {
            systemAlert(t('cloudSync'), t('syncSuccess'));
          } else {
            systemAlert(t('cloudSync'), t('syncFail'));
          }
        } catch (e) {
          systemAlert(t('cloudSync'), t('syncFail'));
        }
        setIsSyncing(false);
      };

      const loadCloudFS = async (username, token) => {
        setIsSyncing(true);
        try {
          const response = await fetch(`https://glassosback.jia12s.workers.dev/api/fs/load`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (response.ok) {
            const data = await response.json();
            if (data.fsData) {
              rxFS_Logic.deserialize(data.fsData);
            }

        } catch (e) {
          console.error("加载云端数据失败", e);
        }
        setIsSyncing(false);
      };

      const openApp = (appId, title, icon, content) => {
        setIsStartMenuOpen(false);
        if (windows.find(w => w.id === appId)) {
          focusWindow(appId);
          return;
        }
        const newWindow = {
          id: appId, title, icon, content,
          zIndex: windows.length + 1,
          x: 100 + (windows.length * 30),
          y: 80 + (windows.length * 30),
          width: 950, height: 650,

        setWindows([...windows, newWindow]);
        setActiveWindow(appId);

      const installApp = () => {
        systemPrompt(t('installApp'), t('enterCode'), "", (jsonStr) => {
          if (!jsonStr) return;
          try {

              name: appData.name || "Custom App",

              content: <CustomRuntime appData={appData} />

            systemAlert(t('errorFormat'), t('errorFormat'));
          }

      const focusWindow = (id) => {
        setActiveWindow(id);
        setWindows(prev => {
          const maxZ = Math.max(0, ...prev.map(w => w.zIndex));
          return prev.map(w => w.id === id ? { ...w, zIndex: maxZ + 1 } : w);
        });
      };

      const closeWindow = (id) => {
        setWindows(windows.filter(w => w.id !== id));
        if (activeWindow === id) setActiveWindow(null);
      };

      const updateWindow = (id, updates) => {
        setWindows(prev => prev.map(w => w.id === id ? { ...w, ...updates } : w));
      };

      const baseApps = [
        { id: 'browser', name: t('browser'), icon: <Icon name="globe" size={20} className="text-green-400" />, content: <BrowserApp t={t} /> },
        { id: 'studio', name: t('studio'), icon: <Icon name="code" size={20} className="text-yellow-400" />, content: <StudioApp t={t} systemAlert={systemAlert} /> },
        { id: 'files', name: t('files'), icon: <Icon name="folder" size={20} className="text-blue-400" />, content: <FilesApp t={t} systemConfirm={systemConfirm} systemPrompt={systemPrompt} saveCloudFS={saveCloudFS} cloudUser={cloudUser} /> },
        { id: 'terminal', name: t('terminal'), icon: <Icon name="terminal" size={20} className="text-gray-400" />, content: <TerminalApp t={t} /> },
        { id: 'settings', name: t('settings'), icon: <Icon name="settings" size={20} className="text-red-400" />, content: <SettingsApp t={t} setWallpaper={setWallpaper} setLang={setLang} lang={lang} cloudUser={cloudUser} setCloudUser={setCloudUser} cloudToken={cloudToken} setCloudToken={setCloudToken} systemAlert={systemAlert} saveCloudFS={saveCloudFS} loadCloudFS={loadCloudFS} /> }
      ];

          {/* 桌面应用网格 */}
          <div className="flex-1 relative p-6 overflow-hidden" onClick={() => setIsStartMenuOpen(false)}>
            <div className="flex flex-col flex-wrap gap-4 h-full w-fit content-start">
              {allApps.map(app => (
                <button key={app.id} onDoubleClick={() => openApp(app.id, app.name, app.icon, app.content)}
                  className="flex flex-col items-center w-24 p-2 rounded-xl hover:bg-white/10 transition-all group">
                  <div className="p-4 bg-white/10 backdrop-blur-xl rounded-2xl shadow-lg border border-white/20 group-hover:scale-105 transition-transform">
                    {app.icon}
                  </div>
                  <span className="mt-2 text-[11px] drop-shadow-md font-medium text-center truncate w-full">{app.name}</span>
                </button>
              ))}
              <button onClick={installApp} className="flex flex-col items-center w-24 p-2 rounded-xl hover:bg-white/10 transition-all text-white/60 border border-dashed border-white/20">
                 <div className="p-4"><Icon name="upload" size={20} /></div>
                 <span className="text-[10px]">{t('installApp')}</span>
              </button>
            </div>

            {windows.map(win => (
              <Window key={win.id} window={win} active={activeWindow === win.id}
                onFocus={() => focusWindow(win.id)} 
                onClose={() => closeWindow(win.id)}
                onUpdate={(updates) => updateWindow(win.id, updates)} />

          </div>

          {/* 底部任务栏 */}
          <div className="h-12 w-full bg-slate-900/60 backdrop-blur-2xl border-t border-white/10 flex items-center px-4 gap-4 z-[9999]">
            <button onClick={(e) => { e.stopPropagation(); setIsStartMenuOpen(!isStartMenuOpen); }}
              className={`p-2 rounded-lg transition-all ${isStartMenuOpen ? 'bg-emerald-600 text-white shadow-lg' : 'hover:bg-white/10 text-white/80'}`}>
              <Icon name="monitor" size={22} />
            </button>
            <div className="flex-1 flex gap-2 overflow-x-auto no-scrollbar">
              {windows.map(win => (
                <button key={win.id} onClick={() => focusWindow(win.id)}
                  className={`flex items-center gap-2 px-3 py-1.5 rounded-lg transition-all border ${
                    activeWindow === win.id ? 'bg-white/20 border-white/30 w-36' : 'bg-transparent border-transparent w-10 overflow-hidden'
                  }`}>
                  <span className="shrink-0">{win.icon}</span>
                  {activeWindow === win.id && <span className="text-[10px] truncate">{win.title}</span>}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-4 px-2 shrink-0">
              {cloudUser ? (
                <div className="flex items-center gap-1.5 bg-emerald-500/20 px-2 py-1 rounded-full border border-emerald-500/30 text-emerald-400 text-[10px] font-bold">
                  <Icon name="cloud" size={12} className={isSyncing ? "animate-spin" : ""} />
                  {cloudUser}
                </div>
              ) : (
                <div className="flex items-center gap-1 opacity-60 text-slate-400 text-[10px]">
                  <Icon name="cloudLightning" size={12} />
                  Offline
                </div>
              )}
              <Icon name="wifi" size={14} className="opacity-60 text-emerald-400" />
              <Icon name="battery" size={14} className="opacity-60" />
              <div className="text-[11px] font-medium opacity-80 min-w-[70px] text-right">
                {currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
              </div>
            </div>
          </div>

          {/* 开始菜单 */}
          {isStartMenuOpen && (
            <div className="absolute bottom-14 left-2 w-80 bg-slate-900/95 backdrop-blur-3xl rounded-2xl border border-white/20 shadow-2xl p-4 z-[10000] animate-in fade-in slide-in-from-bottom-4 duration-200">
              <div className="text-white/40 text-[10px] mb-4 px-2 uppercase tracking-widest font-bold">{t('menuTitle')}</div>
              <div className="grid grid-cols-3 gap-3">
                {allApps.map(app => (
                  <button key={app.id} onClick={() => openApp(app.id, app.name, app.icon, app.content)}
                    className="flex flex-col items-center p-3 rounded-xl hover:bg-white/10 text-white transition-all group">
                    <div className="group-hover:scale-110 transition-transform">{app.icon}</div>
                    <span className="text-[10px] mt-2 truncate w-full text-center">{app.name}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* GlassOS 全局拟态弹窗 */}
          {sysDialog.show && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[100000] animate-in fade-in duration-200">
              <div className="w-96 bg-slate-900/90 border border-white/15 rounded-3xl p-6 shadow-2xl backdrop-blur-2xl animate-in zoom-in-95 duration-200 text-slate-100">
                <h3 className="text-sm font-bold tracking-wider text-emerald-400 mb-2 uppercase">{sysDialog.title}</h3>
                <p className="text-xs text-slate-300 leading-relaxed mb-6">{sysDialog.message}</p>
                {sysDialog.isPrompt && (
                  <input 
                    type="text" 
                    value={sysDialog.value}
                    onChange={(e) => setSysDialog({ ...sysDialog, value: e.target.value })}
                    className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2 text-xs text-white outline-none focus:border-emerald-500 mb-6 font-mono"
                    autoFocus
                  />
                )}
                <div className="flex justify-end gap-3">
                  {(sysDialog.isPrompt || sysDialog.isConfirm) && (
                    <button 
                      onClick={() => setSysDialog({ ...sysDialog, show: false })}
                      className="px-5 py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 rounded-full text-xs font-semibold transition-all"
                    >
                      {t('cancel')}
                    </button>
                  )}
                  <button 
                    onClick={() => {
                      setSysDialog({ ...sysDialog, show: false });
                      if (sysDialog.onConfirm) sysDialog.onConfirm(sysDialog.value);
                    }}
                    className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full text-xs font-bold transition-all shadow-lg"
                  >
                    {t('confirm')}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const Window = ({ window, active, onFocus, onClose, onUpdate }) => {
      const [isResizing, setIsResizing] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const startRef = useRef({ x: 0, y: 0, w: 0, h: 0, left: 0, top: 0, dir: '' });

      const handleMouseDown = (e, type, dir = '') => {
        e.stopPropagation();
        onFocus();
        if (window.isMaximized) return;

        startRef.current = {
          x: e.clientX,
          y: e.clientY,
          w: typeof window.width === 'number' ? window.width : 950,
          h: typeof window.height === 'number' ? window.height : 650,
          left: window.x,
          top: window.y,
          dir
        };

        if (type === 'drag') setIsDragging(true);
        if (type === 'resize') setIsResizing(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (isDragging) {
            const dx = e.clientX - startRef.current.x;
            const dy = e.clientY - startRef.current.y;
            onUpdate({ x: startRef.current.left + dx, y: startRef.current.top + dy });
          }
          if (isResizing) {
            const { x, y, w, h, left, top, dir } = startRef.current;
            const dx = e.clientX - x;
            const dy = e.clientY - y;
            let newW = w, newH = h, newX = left, newY = top;

            if (dir.includes('e')) newW = Math.max(400, w + dx);
            if (dir.includes('s')) newH = Math.max(300, h + dy);
            if (dir.includes('w')) {
              const possibleW = w - dx;
              if (possibleW > 400) { newW = possibleW; newX = left + dx; }
            }
            if (dir.includes('n')) {
              const possibleH = h - dy;
              if (possibleH > 300) { newH = possibleH; newY = top + dy; }
            }

            onUpdate({ width: newW, height: newH, x: newX, y: newY });
          }
        };

        const handleMouseUp = () => {
          setIsDragging(false);
          setIsResizing(false);
        };

        if (isDragging || isResizing) {
          document.addEventListener('mousemove', handleMouseMove);
          document.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging, isResizing, onUpdate]);

      const toggleMaximize = () => {
        if (window.isMaximized) {
          onUpdate({ isMaximized: false, width: 950, height: 650, x: 100, y: 100 });
        } else {
          onUpdate({ isMaximized: true, width: '100%', height: 'calc(100% - 48px)', x: 0, y: 0 });
        }
      };

      const style = window.isMaximized ? {
        left: 0, top: 0, width: '100%', height: 'calc(100vh - 48px)', zIndex: window.zIndex
      } : {
        left: window.x, top: window.y, width: window.width, height: window.height, zIndex: window.zIndex
      };

      return (
        <div className={`absolute flex flex-col rounded-xl shadow-2xl border border-white/20 overflow-hidden backdrop-blur-3xl transition-[box-shadow] duration-200 ${active ? 'ring-1 ring-blue-500/50 shadow-blue-900/20' : 'opacity-95'}`}
          style={{ ...style, backgroundColor: 'rgba(15, 23, 42, 0.88)' }}
          onClick={onFocus}>
          
          {!window.isMaximized && (
            <>
              <div className="absolute top-0 left-0 w-2 h-2 cursor-nw-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'nw')} />
              <div className="absolute top-0 right-0 w-2 h-2 cursor-ne-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'ne')} />
              <div className="absolute bottom-0 left-0 w-2 h-2 cursor-sw-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'sw')} />
              <div className="absolute bottom-0 right-0 w-2 h-2 cursor-se-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'se')} />
              <div className="absolute top-0 left-2 right-2 h-1 cursor-n-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'n')} />
              <div className="absolute bottom-0 left-2 right-2 h-1 cursor-s-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 's')} />
              <div className="absolute left-0 top-2 bottom-2 w-1 cursor-w-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'w')} />
              <div className="absolute right-0 top-2 bottom-2 w-1 cursor-e-resize z-50" onMouseDown={(e) => handleMouseDown(e, 'resize', 'e')} />
            </>
          )}

          <div className="h-10 flex items-center justify-between px-4 bg-white/5 cursor-default select-none shrink-0 border-b border-white/10" 
            onMouseDown={(e) => handleMouseDown(e, 'drag')}
            onDoubleClick={toggleMaximize}>
            <div className="flex items-center gap-2 text-white/90 text-[10px] font-bold uppercase tracking-widest">
              {window.icon} {window.title}
            </div>
            <div className="flex items-center gap-1">
              <button className="hover:bg-white/10 p-1.5 rounded-md text-white/50 transition-all"><Icon name="minus" size={14} /></button>
              <button onClick={toggleMaximize} className="hover:bg-white/10 p-1.5 rounded-md text-white/50 transition-all"><Icon name="maximize" size={12} /></button>
              <button onClick={onClose} className="hover:bg-red-500 p-1.5 rounded-md text-white/50 hover:text-white transition-all ml-1"><Icon name="x" size={14} /></button>
            </div>
          </div>

          <div className="flex-1 overflow-hidden relative bg-slate-950">
            {isResizing && <div className="absolute inset-0 z-[100] bg-transparent" />}
            {window.content}
          </div>
        </div>
      );
    };

    const BrowserApp = ({ t }) => {
      const PROXY_ENDPOINT = "https://glassosback.jia12s.workers.dev/"; 
      const [inputUrl, setInputUrl] = useState('');
      const [iframeSrc, setIframeSrc] = useState('about:blank');
      const [isHome, setIsHome] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [activeTabName, setActiveTabName] = useState('Home');

      const handleNavigate = (target) => {
        let url = target || inputUrl.trim();
        if (!url) return;

        if (!url.includes('.') || url.includes(' ')) {
          url = `https://www.bing.com/search?q=${encodeURIComponent(url)}`;
        } else if (!url.startsWith('http')) {
          url = 'https://' + url;
        }

        const displayHost = url.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
        setInputUrl(url);
        setActiveTabName(displayHost);
        
        setIsLoading(true);
        setIsHome(false);
        setIframeSrc(`${PROXY_ENDPOINT}${url}`);
      };

      const resetToHome = () => {
        setInputUrl('');
        setIframeSrc('about:blank');
        setIsHome(true);
        setIsLoading(false);
        setActiveTabName('Home');
      };

      const bookmarks = [
        { name: 'GitHub', domain: 'github.com', bg: 'bg-zinc-800 hover:bg-zinc-700' },
        { name: 'Bing', domain: 'bing.com', bg: 'bg-sky-900/60 hover:bg-sky-900/80' },
        { name: 'Wikipedia', domain: 'wikipedia.org', bg: 'bg-amber-900/60 hover:bg-amber-900/80' },
      ];

      return (
        <div className="h-full flex flex-col bg-slate-900 text-slate-100 font-sans">
          <div className="bg-slate-900 p-2 border-b border-white/10 flex items-center gap-3">
            <button onClick={resetToHome} className="p-1.5 hover:bg-white/10 rounded-lg text-slate-400 hover:text-white">
              <Icon name="globe2" size={16} />
            </button>
            <div className="flex-1 bg-slate-950/80 border border-white/10 focus-within:border-emerald-500 rounded-xl px-3 py-1.5 flex items-center gap-2">
              <input 
                type="text" 
                className="bg-transparent border-none outline-none text-xs w-full text-slate-100 font-mono"
                value={inputUrl}
                onChange={(e) => setInputUrl(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleNavigate()}
                placeholder="Search or enter URL"
              />
              <button onClick={() => handleNavigate()} className="text-[10px] bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded-lg font-bold">
                GO
              </button>
            </div>
          </div>
          <div className="flex-1 relative bg-white overflow-hidden">
            {isLoading && (
              <div className="absolute top-0 left-0 w-full h-1 bg-slate-800 z-50">
                <div className="h-full bg-emerald-500 animate-pulse" style={{ width: '60%' }} />
              </div>
            )}
            {isHome ? (
              <div className="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center p-6 text-center z-40">
                <h1 className="text-2xl font-black mb-2">{t('welcomeMsg')}</h1>
                <p className="text-xs text-slate-400 max-w-sm mb-8 leading-relaxed">{t('bypassInfo')}</p>
                <div className="grid grid-cols-3 gap-4 w-full max-w-xl">
                  {bookmarks.map(bm => (
                    <button key={bm.name} onClick={() => handleNavigate(bm.domain)}
                      className={`${bm.bg} p-4 rounded-2xl border border-white/5 transition-all text-left flex flex-col h-24 shadow-xl`}>
                      <span className="text-xs font-black text-white/50">{bm.name}</span>
                      <span className="text-[10px] font-mono opacity-80 text-white/80">{bm.domain}</span>
                    </button>
                  ))}
                </div>
              </div>
            ) : null}
            <iframe 
              src={iframeSrc} 
              className="w-full h-full border-none bg-white" 
              onLoad={() => setIsLoading(false)}
              title="Bypass Frame"
            />
          </div>
        </div>
      );
    };

    const StudioApp = ({ t, systemAlert }) => {
      const [tab, setTab] = useState('html');
      const [appName, setAppName] = useState("My New App");
      const [codes, setCodes] = useState({
        html: `<div class="container">\n  <div class="card">\n    <h1>GlassOS App</h1>\n    <p id="counter">0</p>\n    <button id="add">增加计数 / Add Count</button>\n  </div>\n</div>`,
        css: `body { \n  background: linear-gradient(135deg, #1e293b, #0f172a);\n  display: flex; justify-content: center; align-items: center;\n  height: 100vh; margin: 0; font-family: system-ui;\n}\n.card {\n  background: rgba(255, 255, 255, 0.1);\n  backdrop-filter: blur(10px);\n  padding: 40px; border-radius: 24px;\n  border: 1px solid rgba(255, 255, 255, 0.2);\n  text-align: center; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.3);\n}\n#counter { font-size: 48px; font-weight: bold; margin: 20px 0; }\nbutton {\n  background: #10b981; color: white; border: none; \n  padding: 12px 24px; border-radius: 12px; cursor: pointer;\n  font-weight: bold; transition: all 0.2s;\n}\nbutton:hover { transform: translateY(-2px); background: #059669; }`,
        js: `let count = 0;\nconst display = document.getElementById('counter');\ndocument.getElementById('add').onclick = () => {\n  count++;\n  display.innerText = count;\n};`
      });
      const [previewKey, setPreviewKey] = useState(0);

      const exportApp = () => {
        const bundle = {
          name: appName,
          html: codes.html,
          css: codes.css,
          js: codes.js,
          version: "1.5.0"
        };
        const jsonStr = JSON.stringify(bundle, null, 2);
        const fileName = `/文档/${appName}.glassosapp`;
        
        rxFS_Logic.start(fileName);
        rxFS_Logic.set(fileName, jsonStr);

        const textarea = document.createElement("textarea");
        textarea.value = jsonStr;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        
        systemAlert(t('studio'), `${t('exportSave')}: ${fileName}\n\n${t('copySuccess')}`);
      };

      // 修复：通过模板拼接规避字面量闭合脚本 tag 的解析器冲突问题
      const compiledSrcDoc = `<html><head><style>${codes.css}</style></head><body>${codes.html}<script>try { ${codes.js} } catch(e) { console.error(e); }</` + 'script></body></html>';

      return (
        <div className="h-full flex flex-col bg-[#020617]">
          <div className="flex items-center justify-between p-3 border-b border-white/10 bg-white/5 overflow-x-auto gap-4 shrink-0">

              {['html', 'css', 'js'].map(t => (

                  {t}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-3 shrink-0">
              <input value={appName} onChange={e => setAppName(e.target.value)} 
                className="bg-transparent border-b border-white/20 text-xs text-white px-2 outline-none w-32 focus:border-emerald-500" />
              <button onClick={() => setPreviewKey(k => k + 1)} className="p-2 text-green-400 hover:bg-green-500/10 rounded-lg"><Icon name="play" size={16} /></button>
              <button onClick={exportApp} className="flex items-center gap-2 px-4 py-1 bg-emerald-600 hover:bg-emerald-500 rounded-full text-[10px] font-bold text-white transition-all shadow-lg">
                <Icon name="download" size={14} /> {t('installApp')} (Export)
              </button>
            </div>
          </div>
          <div className="flex-1 flex overflow-hidden">
            <div className="flex-1 h-full border-r border-white/10">
              <textarea 
                className="w-full h-full bg-transparent p-4 text-sm font-mono text-blue-100/70 outline-none resize-none"
                value={codes[tab]}
                onChange={e => setCodes({...codes, [tab]: e.target.value})}
                spellCheck={false}
              />
            </div>
            <div className="flex-1 h-full bg-white overflow-hidden relative">
               <iframe
                 key={previewKey}
                 title="preview"
                 className="w-full h-full border-none"
                 srcDoc={compiledSrcDoc}
               />
            </div>
          </div>
        </div>
      );
    };

    const CustomRuntime = ({ appData }) => {
      // 修复：使用字符串拼接防止浏览器对 runtime script 提前结束解析
      const runtimeSrcDoc = `<html><head><style>${appData.css}</style></head><body>${appData.html}<script>(function() { try { ${appData.js} } catch(err) { document.body.innerHTML += '<div style="color:red;padding:10px;font-family:monospace">Error: ' + err.message + '</div>'; } })();</` + 'script></body></html>';
      
      return (
        <iframe
          className="w-full h-full border-none bg-white"
          srcDoc={runtimeSrcDoc}
        />
      );
    };

    const FilesApp = ({ t, systemConfirm, systemPrompt, saveCloudFS, cloudUser }) => {
      const [files, setFiles] = useState([]);

      const refreshList = () => {
        setFiles(rxFS_Logic.list("/"));
      };

      useEffect(() => {
        refreshList();
      }, []);

      const createNewFile = () => {
        systemPrompt(t('newFile'), t('inputName'), "note.txt", (name) => {
          if (!name) return;
          const path = `/文档/${name}`;
          rxFS_Logic.start(path);
          refreshList();
        });
      };

      const downloadFile = (path) => {
        const content = rxFS_Logic.open(path);
        if (content === null) return;

        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = path.split('/').pop();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const deleteFile = (path) => {
        systemConfirm(t('files'), `${t('cancel')} / ${t('confirm')}? (${path})`, () => {
          rxFS_Logic.del(path);
          refreshList();
        });
      };

      return (
        <div className="h-full bg-slate-950 flex flex-col">
          <div className="p-4 border-b border-white/10 bg-white/5 flex justify-between items-center">
            <div className="flex gap-2">
              <button onClick={createNewFile} className="flex items-center gap-1.5 px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-full text-xs font-bold transition-all text-white">
                <Icon name="plus" size={14} /> {t('newFile')}
              </button>
              {cloudUser && (
                <button onClick={() => saveCloudFS()} className="flex items-center gap-1.5 px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-full text-xs font-bold transition-all text-white">
                  <Icon name="refresh" size={14} /> {t('cloudSync')}
                </button>
              )}
            </div>
            <div className="text-[10px] text-white/30 uppercase tracking-tighter font-bold">rxFS Virtual Storage</div>
          </div>
          <div className="flex-1 overflow-y-auto p-4">
            <div className="grid grid-cols-1 gap-2">
              {files.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 opacity-20">
                  <Icon name="folder" size={48} />
                  <p className="text-xs mt-4">{t('emptyFolder')}</p>
                </div>
              ) : (
                files.map(f => (
                  <div key={f} className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/10 hover:bg-white/10 transition-colors group">
                    <div className="flex items-center gap-3 overflow-hidden">
                      <Icon name="fileText" size={18} className="text-blue-400 shrink-0" />
                      <span className="text-xs text-white/80 truncate">{f.split('/').pop()}</span>
                    </div>
                    <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button onClick={() => downloadFile(f)} className="p-2 hover:bg-blue-500/20 text-blue-400 rounded-lg">
                        <Icon name="fileDown" size={16} />
                      </button>
                      <button onClick={() => deleteFile(f)} className="p-2 hover:bg-red-500/20 text-red-400 rounded-lg">
                        <Icon name="trash" size={16} />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    };

    const TerminalApp = ({ t }) => {
      const [history, setHistory] = useState(['GlassOS Shell [Version 1.5.0]', 'Type "help" for commands.']);
      const [cmd, setCmd] = useState('');
      const handleCmd = (e) => {
        if (e.key === 'Enter') {
          const newHistory = [...history, `> ${cmd}`];
          if (cmd === 'help') newHistory.push('Available commands: help, clear, version, ls');
          else if (cmd === 'clear') { setHistory([]); setCmd(''); return; }
          else if (cmd === 'ls') newHistory.push(rxFS_Logic.list('/').join('  '));
          else if (cmd === 'version') newHistory.push('GlassOS 1.5.0 "Iceberg"');
          else newHistory.push(`Command not found: ${cmd}`);
          setHistory(newHistory);
          setCmd('');
        }
      };
      return (
        <div className="h-full bg-black p-4 font-mono text-xs text-blue-400 overflow-y-auto">
          {history.map((line, i) => <div key={i} className="mb-1 leading-relaxed">{line}</div>)}
          <div className="mt-2 flex gap-2">
            <span className="text-green-500 font-bold">guest@glassos:~$</span>
            <input className="bg-transparent outline-none flex-1 text-white" 
                   value={cmd} onChange={e => setCmd(e.target.value)} onKeyDown={handleCmd} autoFocus />
          </div>
        </div>
      );
    };

    const SettingsApp = ({ t, setWallpaper, setLang, lang, cloudUser, setCloudUser, cloudToken, setCloudToken, systemAlert, saveCloudFS, loadCloudFS }) => {
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authMode, setAuthMode] = useState('login'); // login / register

      const languagesList = [
        { code: "zh", name: "简体中文" }, { code: "zht", name: "繁體中文" }, { code: "en", name: "English" },
        { code: "ja", name: "日本語" }, { code: "ko", name: "한국어" }, { code: "fr", name: "Français" },
        { code: "es", name: "Español" }, { code: "de", name: "Deutsch" }, { code: "it", name: "Italiano" },
        { code: "ru", name: "Русский" }, { code: "pt", name: "Português" }, { code: "ar", name: "العربية" },
        { code: "vi", name: "Tiếng Việt" }, { code: "tr", name: "Türkçe" }, { code: "nl", name: "Nederlands" }
      ];

      const wallpapers = [
        'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&q=80',
        'https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?auto=format&fit=crop&q=80'
      ];

      const handleAuth = async (e) => {
        e.preventDefault();
        if (!usernameInput || !passwordInput) return;

        const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
        try {
          const response = await fetch(`https://glassosback.jia12s.workers.dev${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameInput, password: passwordInput })
          });
          const data = await response.json();
          if (response.ok) {
            if (authMode === 'login') {
              setCloudToken(data.token);
              setCloudUser(usernameInput);
              localStorage.setItem("glassos_token", data.token);
              localStorage.setItem("glassos_user", usernameInput);
              await loadCloudFS(usernameInput, data.token);
              systemAlert(t('cloudAccount'), t('loginSuccess'));
            } else {
              systemAlert(t('cloudAccount'), t('registerSuccess'));
              setAuthMode('login');
            }
          } else {
            systemAlert(t('cloudAccount'), data.error || 'Operation failed');
          }
        } catch (err) {
          systemAlert(t('cloudAccount'), 'Network or Server Error');
        }
      };

      const handleLogout = () => {
        setCloudToken(null);
        setCloudUser(null);
        localStorage.removeItem("glassos_token");
        localStorage.removeItem("glassos_user");
        rxFS_Logic.clean();
        systemAlert(t('cloudAccount'), t('logoutSuccess'));
      };

      return (
        <div className="p-6 overflow-y-auto h-full bg-slate-900 text-slate-100 space-y-6">
          
          {/* 云端账户模块 */}
          <div className="bg-slate-950/40 border border-white/10 rounded-2xl p-5">
            <div className="flex items-center gap-3 mb-4 text-emerald-400">
              <Icon name="cloud" size={18} />
              <h3 className="text-xs font-bold tracking-widest uppercase">{t('cloudAccount')}</h3>
            </div>

            {cloudUser ? (
              <div className="space-y-4">
                <div className="flex items-center justify-between p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-xs text-emerald-400">
                  <div className="flex items-center gap-2">
                    <Icon name="user" size={16} />
                    <span>{cloudUser} (Logged In)</span>
                  </div>
                  <button onClick={handleLogout} className="flex items-center gap-1 text-red-400 font-bold">
                    <Icon name="logout" size={12} /> Logout
                  </button>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => saveCloudFS()} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                    <Icon name="cloud" size={14} /> Upload rxFS to Cloud
                  </button>
                  <button onClick={() => loadCloudFS(cloudUser, cloudToken)} className="flex-1 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                    <Icon name="refresh" size={14} /> Pull from Cloud
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleAuth} className="space-y-3">
                <div className="flex bg-slate-950/80 rounded-xl p-1 border border-white/10">
                  <button type="button" onClick={() => setAuthMode('login')} className={`flex-1 py-1.5 text-xs rounded-lg font-bold ${authMode === 'login' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                    {t('cloudLogin')}
                  </button>
                  <button type="button" onClick={() => setAuthMode('register')} className={`flex-1 py-1.5 text-xs rounded-lg font-bold ${authMode === 'register' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                    {t('cloudRegister')}
                  </button>
                </div>
                <div className="space-y-2">
                  <input type="text" placeholder={t('username')} value={usernameInput} onChange={e => setUsernameInput(e.target.value)}
                    className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2 text-xs outline-none focus:border-emerald-500" />
                  <input type="password" placeholder={t('password')} value={passwordInput} onChange={e => setPasswordInput(e.target.value)}
                    className="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2 text-xs outline-none focus:border-emerald-500" />
                </div>
                <button type="submit" className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                  <Icon name="login" size={14} /> {authMode === 'login' ? t('cloudLogin') : t('cloudRegister')}
                </button>
              </form>
            )}
          </div>

          {/* 语言偏好设置 */}
          <div className="bg-slate-950/40 border border-white/10 rounded-2xl p-5">
            <div className="flex items-center gap-3 mb-4 text-emerald-400">
              <Icon name="globe2" size={18} />
              <h3 className="text-xs font-bold tracking-widest uppercase">{t('systemLang')}</h3>
            </div>
            <p className="text-[11px] text-slate-400 mb-4">{t('selectLang')}</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {languagesList.map((item) => (
                <button key={item.code} onClick={() => setLang(item.code)}
                  className={`flex items-center justify-between p-3 rounded-xl border text-xs ${
                    lang === item.code ? 'bg-emerald-600/20 border-emerald-500 text-emerald-400 font-bold' : 'bg-white/5 border-white/5 text-slate-400'
                  }`}>
                  <span>{item.name}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="bg-slate-950/40 border border-white/10 rounded-2xl p-5">
            <div className="flex items-center gap-3 mb-4 text-emerald-400">
              <Icon name="settings" size={18} />
              <h3 className="text-xs font-bold tracking-widest uppercase">{t('wallpaper')}</h3>
            </div>
            <div className="grid grid-cols-3 gap-3">
              {wallpapers.map((url, i) => (
                <button key={i} onClick={() => setWallpaper(url)} className="h-16 rounded-xl border border-white/10 overflow-hidden relative">
                  <img src={url} className="w-full h-full object-cover" alt="Wallpaper Preview" />
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
