<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 700px;
            width: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        h1 {
            font-size: 48px;
            color: #667eea;
            font-weight: 700;
        }
        
        .lang-switch {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .lang-switch:hover {
            background: #667eea;
            color: white;
        }
        
        .content {
            margin-top: 30px;
        }
        
        .section {
            margin-bottom: 35px;
        }
        
        .section-title {
            font-size: 20px;
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .link-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        
        .link-item:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .link-icon {
            font-size: 24px;
            margin-right: 15px;
            min-width: 30px;
        }
        
        .link-text {
            flex: 1;
        }
        
        .link-text strong {
            display: block;
            margin-bottom: 3px;
        }
        
        .link-text small {
            opacity: 0.7;
            font-size: 12px;
        }
        
        .link-item:hover .link-text small {
            opacity: 0.9;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }
            
            h1 {
                font-size: 36px;
            }
            
            .header {
                justify-content: center;
            }
            
            .section-title {
                font-size: 18px;
            }
            
            .link-item {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="content">

                    <div class="link-text">
                        <strong>我的 Bilibili</strong>

                    </div>

            </div>
            
            <div class="section">

                <a href="https://shequ.codemao.cn/user/1539144230" class="link-item" target="_blank" rel="noopener noreferrer">
                    <div class="link-icon">🔧</div>
                    <div class="link-text">
                        <strong>编程猫社区</strong>
                        <small>我的编程项目和教程</small>
                    </div>
                </a>
            </div>
            
            <div class="section">
                <div class="section-title">📱 关于我</div>
                <p style="color: #666; line-height: 1.6; font-size: 14px;">
                    欢迎来到我的个人主页！我是一名程序员和内容创作者，热衷于分享知识和创作有趣的内容。欢迎浏览我的项目，关注我的频道！
                </p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 garjia. 保留所有权利。</p>
        </div>
    </div>
</body>
</html>
