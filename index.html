<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="garjia's personal homepage - Programming, Bilibili, and more">
    <title>garjia - Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 700;
        }
        
        .language-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .lang-btn {
            padding: 12px 30px;
            font-size: 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        
        .lang-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .info-text {
            color: #666;
            font-size: 14px;
            margin-top: 30px;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }
            
            h1 {
                font-size: 36px;
            }
            
            .language-selector {
                flex-direction: column;
            }
            
            .lang-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>garjia</h1>
        <p style="color: #999; margin-bottom: 30px; font-size: 16px;">Welcome to my homepage</p>
        
        <div class="language-selector">
            <a href="en.html" class="lang-btn">English</a>
            <a href="ch.html" class="lang-btn">中文</a>
        </div>
        
        <div class="info-text">
            <p>Select your preferred language to continue →</p>
        </div>
    </div>
</body>
</html>
