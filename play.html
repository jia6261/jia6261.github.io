<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Retro 3D Explorer - MultiLang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* 保持像素风格 */
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5); /* 弱化准星，仅作为视线参考 */
            border-radius: 50%;
        }
        #click-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid white;
            pointer-events: none;
            z-index: 100;
        }
        .clickable {
            pointer-events: auto;
            cursor: pointer;
        }
        .clickable:hover {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="game-container" class="relative overflow-hidden shadow-2xl border-4 border-white" style="width: 800px; height: 450px; background-color: #000;">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div id="ui-overlay">
            <canvas id="minimap" width="120" height="120" class="absolute top-4 left-4 border-2 border-white opacity-90 bg-black"></canvas>
            
            <div class="crosshair"></div>

            <div id="click-hint">点击画面开始探索 / Click to Explore</div>

            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                <div class="bg-black p-2 border-2 border-white">
                    <p id="label-pos" class="text-[10px] text-white font-bold uppercase">坐标 / POS</p>
                    <p id="pos-display" class="text-sm font-bold text-white">0, 0</p>
                </div>

                <div id="lang-btn" class="bg-black p-2 border-2 border-white text-center mb-1 clickable">
                    <p class="text-[10px] font-bold">EN / 中文</p>
                </div>

                <div class="bg-black p-2 border-2 border-white text-right">
                    <p id="label-status" class="text-[10px] text-white font-bold uppercase">探索模式 / STATUS</p>
                    <p id="scan-status" class="text-sm font-bold text-white">READY</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let currentLang = 'zh';
            const i18n = {
                zh: {
                    hint: "点击画面激活控制 (WASD 移动 / 鼠标转动)",
                    pos: "坐标 (X, Y)",
                    status: "探索状态",
                    engine: "无限迷宫生成中",
                    start: "点击开始探索"
                },
                en: {
                    hint: "Click to focus (WASD Move / Mouse Look)",
                    pos: "COORD (X, Y)",
                    status: "EXPLORE STATUS",
                    engine: "PROCEDURAL MAZE",
                    start: "Click to Explore"
                }
            };

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const minimap = document.getElementById('minimap');
            const mCtx = minimap.getContext('2d');
            const posDisplay = document.getElementById('pos-display');
            const gameContainer = document.getElementById('game-container');
            const hint = document.getElementById('click-hint');
            const langBtn = document.getElementById('lang-btn');
            const labelPos = document.getElementById('label-pos');
            const labelStatus = document.getElementById('label-status');
            const scanStatus = document.getElementById('scan-status');

            function updateLanguageUI() {
                const lang = i18n[currentLang];
                hint.innerText = isLocked ? "" : lang.hint;
                labelPos.innerText = lang.pos;
                labelStatus.innerText = lang.status;
                scanStatus.innerText = lang.engine;
            }

            langBtn.onclick = (e) => {
                e.stopPropagation();
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                updateLanguageUI();
            };

            const TILE_SIZE = 64; 
            let isLocking = false; 

            function getTile(gx, gy) {
                if (Math.abs(gx) <= 1 && Math.abs(gy) <= 1) return 0;
                let val = Math.sin(gx * 0.8) + Math.cos(gy * 0.8) + Math.sin(gx * gy * 0.1);
                return val > 1.2 ? 1 : 0; 
            }

            let player = {
                x: 96, y: 96, dir: 0,
                fov: Math.PI / 3,
                radius: 14,
                bob: 0
            };

            const keys = {};
            let isLocked = false;

            const lockPointer = () => {
                if (isLocking || isLocked) return;
                isLocking = true;
                window.focus();
                try {
                    const promise = gameContainer.requestPointerLock();
                    if (promise && promise.catch) {
                        promise.catch((err) => {
                            if (err.name !== 'NotAllowedError' && err.name !== 'SecurityError') {
                                console.warn("PointerLock Error:", err);
                            }
                        }).finally(() => { isLocking = false; });
                    } else { isLocking = false; }
                } catch (e) { isLocking = false; }
            };

            gameContainer.addEventListener('mousedown', (e) => {
                if (e.target === langBtn || langBtn.contains(e.target)) return;
                if (!isLocked) lockPointer();
                e.preventDefault();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === gameContainer) {
                    isLocked = true;
                    hint.style.display = 'none';
                } else {
                    isLocked = false;
                    hint.style.display = 'block';
                    updateLanguageUI();
                }
                isLocking = false;
            });

            document.addEventListener('pointerlockerror', () => {
                isLocked = false;
                isLocking = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (isLocked) player.dir += e.movementX * 0.003;
            });

            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                keys[k] = true;
                if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
            });

            window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
            window.addEventListener('blur', () => { for(let k in keys) keys[k] = false; });

            function isAtWall(x, y) {
                const gx = Math.floor(x / TILE_SIZE);
                const gy = Math.floor(y / TILE_SIZE);
                return getTile(gx, gy) === 1;
            }

            function checkCollision(nx, ny) {
                const r = player.radius;
                return isAtWall(nx - r, ny - r) || isAtWall(nx + r, ny - r) || 
                       isAtWall(nx - r, ny + r) || isAtWall(nx + r, ny + r) || isAtWall(nx, ny);
            }

            function update() {
                const speed = 3.5;
                let moving = false;
                let dx = 0, dy = 0;

                if (!isLocked && document.activeElement !== gameContainer && !Object.values(keys).some(v => v)) return;

                if (keys['w'] || keys['arrowup']) { dx += Math.cos(player.dir) * speed; dy += Math.sin(player.dir) * speed; moving = true; }
                if (keys['s'] || keys['arrowdown']) { dx -= Math.cos(player.dir) * speed; dy -= Math.sin(player.dir) * speed; moving = true; }
                if (keys['a'] || keys['arrowleft']) { dx += Math.cos(player.dir - Math.PI/2) * speed; dy += Math.sin(player.dir - Math.PI/2) * speed; moving = true; }
                if (keys['d'] || keys['arrowright']) { dx += Math.cos(player.dir + Math.PI/2) * speed; dy += Math.sin(player.dir + Math.PI/2) * speed; moving = true; }

                if (!checkCollision(player.x + dx, player.y)) player.x += dx;
                if (!checkCollision(player.x, player.y + dy)) player.y += dy;

                if (moving) player.bob += 0.12; // 移动时的视角轻微波动
                else player.bob *= 0.9;

                posDisplay.innerText = `${Math.floor(player.x)}, ${Math.floor(player.y)}`;
            }

            function draw3DScene() {
                ctx.fillStyle = "#000"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制简单的地平线效果
                ctx.fillStyle = "#050505";
                ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);

                const numRays = canvas.width;
                const rayAngleStep = player.fov / numRays;
                const bobOffset = Math.sin(player.bob) * 5; // 视角摇晃

                for (let i = 0; i < numRays; i++) {
                    let rayAngle = (player.dir - player.fov / 2) + i * rayAngleStep;
                    let distanceToWall = 0;
                    let hitWall = false;
                    let eyeX = Math.cos(rayAngle), eyeY = Math.sin(rayAngle);

                    while (!hitWall && distanceToWall < 800) {
                        distanceToWall += 2.0;
                        let testX = Math.floor((player.x + eyeX * distanceToWall) / TILE_SIZE);
                        let testY = Math.floor((player.y + eyeY * distanceToWall) / TILE_SIZE);
                        if (getTile(testX, testY) === 1) hitWall = true;
                    }

                    let correctedDistance = distanceToWall * Math.cos(player.dir - rayAngle);
                    let wallHeight = (TILE_SIZE * canvas.height) / correctedDistance;
                    
                    let drawWall = false;
                    if (correctedDistance < 150) drawWall = true; 
                    else if (correctedDistance < 400) { if ((i + Math.floor(correctedDistance/2)) % 2 === 0) drawWall = true; }
                    else if (correctedDistance < 700) { if ((i + Math.floor(correctedDistance/4)) % 4 === 0) drawWall = true; }

                    if (drawWall) {
                        ctx.fillStyle = "#fff";
                        // 绘制垂直线条，加入视角摇晃偏移
                        ctx.fillRect(i, (canvas.height - wallHeight) / 2 + bobOffset, 1, wallHeight);
                    }
                }
            }

            function drawMinimap() {
                mCtx.fillStyle = "black";
                mCtx.fillRect(0,0, minimap.width, minimap.height);
                const centerX = minimap.width / 2;
                const centerY = minimap.height / 2;
                const viewRange = 8;
                const pGX = Math.floor(player.x / TILE_SIZE);
                const pGY = Math.floor(player.y / TILE_SIZE);
                
                mCtx.strokeStyle = "rgba(255,255,255,0.4)";
                mCtx.lineWidth = 0.5;
                for (let y = -viewRange; y <= viewRange; y++) {
                    for (let x = -viewRange; x <= viewRange; x++) {
                        if (getTile(pGX + x, pGY + y) === 1) {
                            mCtx.strokeRect(centerX + x * 10, centerY + y * 10, 10, 10);
                        }
                    }
                }
                
                // 玩家方向指示线
                mCtx.strokeStyle = "white";
                mCtx.beginPath();
                mCtx.moveTo(centerX, centerY);
                mCtx.lineTo(centerX + Math.cos(player.dir) * 10, centerY + Math.sin(player.dir) * 10);
                mCtx.stroke();
                
                mCtx.fillStyle = "white";
                mCtx.beginPath(); mCtx.arc(centerX, centerY, 3, 0, Math.PI * 2); mCtx.fill();
            }

            function gameLoop() {
                update();
                draw3DScene();
                drawMinimap();
                requestAnimationFrame(gameLoop);
            }

            updateLanguageUI();
            gameLoop();
        })();
    </script>
</body>
</html>
